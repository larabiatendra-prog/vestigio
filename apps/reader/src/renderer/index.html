<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP del renderer; connect-src ws solo lo usa el dev server local -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: vestigio:; connect-src 'self' ws://localhost:*; object-src 'none'; base-uri 'none'"
    />
    <title>Vestigio</title>
  </head>
  <body>
    <div id="raiz"></div>
  </body>
</html>
